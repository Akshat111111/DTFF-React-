# Build the React/Vite app and publish to GitHub Pages.
#
# The React app lives in react-app/ and Vite is configured to output to
# website/ (outDir: '../website'). This workflow installs dependencies,
# runs the build, then uploads website/ as the Pages artifact.
name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - 'react-app/**'
      - 'website/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: react-app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: react-app

      - name: Build with Vite
        run: npm run build
        working-directory: react-app

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
