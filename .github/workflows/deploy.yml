# Build the site from source and publish it to GitHub Pages.
#
# GitHub Pages can only serve a branch root or /docs, and this site lives in
# website/. Publishing through Actions keeps the repository structure intact and
# rebuilds from _src/ on every push, so the deployed site can never drift from
# its source.
name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - '_src/**'
      - 'website/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild from source
        run: |
          python3 _src/build.py
          python3 _src/signature.py

      - name: Fail if the committed output is stale
        run: |
          if ! git diff --quiet -- website/; then
            echo "::error::website/ does not match what _src/ generates."
            echo "Run 'python3 _src/build.py && python3 _src/signature.py' and commit the result."
            git --no-pager diff --stat -- website/
            exit 1
          fi
          echo "Committed output matches source."

      - name: Check internal links
        run: |
          python3 - <<'PY'
          import os, re, glob, sys
          os.chdir('website')
          files = [f for f in glob.glob('**/*.html', recursive=True) if 'signature' not in f]
          ids = {f: set(re.findall(r'\sid="([^"]+)"', open(f, encoding='utf-8').read())) for f in files}
          broken, anchors = [], []
          for f in files:
              s = open(f, encoding='utf-8').read()
              base = os.path.dirname(f)
              for _, val in re.findall(r'(href|src)="([^"]+)"', s):
                  if val.startswith(('mailto:', 'tel:', 'data:', 'javascript:', 'http://', 'https://', '//')):
                      continue
                  if val.startswith('#'):
                      if val[1:] not in ids[f]:
                          anchors.append((f, val))
                      continue
                  path, _, frag = val.partition('#')
                  if not path:
                      continue
                  t = os.path.normpath(os.path.join(base, path)) if not path.startswith('/') else path.lstrip('/')
                  if not os.path.exists(t):
                      broken.append((f, val)); continue
                  if frag and t.endswith('.html') and f'id="{frag}"' not in open(t, encoding='utf-8').read():
                      anchors.append((f, val))
          print(f'{len(files)} pages | {len(broken)} broken links | {len(anchors)} missing anchors')
          for x in broken + anchors:
              print('  ', x)
          sys.exit(1 if (broken or anchors) else 0)
          PY

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
